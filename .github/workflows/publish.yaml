# Public images and releases, run on the GitHub mirror of the Gitea repository.
#
#   push to main   ghcr.io/<owner>/orbitalwindow{,-samba}:main
#   tag v*         ghcr.io/<owner>/orbitalwindow{,-samba}:<tag> and :latest, plus a GitHub release
#                  with the deploy folder as orbitalwindow-deploy-<tag>.tar.gz
---
name: Publish
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Lint and test
        run: |
          pip install hatch
          hatch run lint:check
          hatch test

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: orbitalwindow
            context: .
          - name: orbitalwindow-samba
            context: deploy/samba
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the release with the deploy folder
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundle="orbitalwindow-deploy-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix=orbitalwindow/ -o "$bundle" "${GITHUB_REF_NAME}:deploy"
          gh release create "$GITHUB_REF_NAME" "$bundle" --verify-tag --generate-notes
