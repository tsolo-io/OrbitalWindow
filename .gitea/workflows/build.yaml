---
name: Build
run-name: Tests and Build OrbitalWindow
on:
  push:
  workflow_dispatch:

jobs:
  publish:
    runs-on: "native"
    container:
      image: gitea.tu.tsolo.net/tsolo/ubuntu:24-ci
    # The tests use a real PostgreSQL server (ADR 0046), the same image as deploy/compose.yaml.
    # From AWS's mirror of Docker's official images (same digest): the runner pulls it for every
    # job, and Docker Hub refuses anonymous pulls after a few (429 Too Many Requests).
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: test
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      OW_TEST_DATABASE_URL: postgresql://postgres:test@postgres:5432/postgres
    steps:
      - name: Check out repository code
        uses: https://gitea.com/actions/checkout@v4
      - name: Run tests and build
        run: |
          hatch run lint:check
          # hatch run testing:test
          make test
          hatch build
      - name: Make containers and publish
        uses: https://gitea.tu.tsolo.net/Tsolo/container-build-publish-action@main
        with:
          registrypassword: ${{ secrets.REGISTRYPASSWORD }}

      - name: Make Samba container and publish
        uses: https://gitea.tu.tsolo.net/Tsolo/container-build-publish-action@main
        with:
          registrypassword: ${{ secrets.REGISTRYPASSWORD }}
          context: deploy/samba
          name: orbitalwindow-samba
