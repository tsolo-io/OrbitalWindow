[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbitalwindow"
dynamic = ["version"]
description = "Manage GPU-accelerated research/science environments on Docker by providing virtual desktops and running inverence workloads."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSES/*"]
requires-python = ">=3.14,<3.15"
keywords = ['Science', 'Desktop', 'AI']
dependencies = [
  "fastapi>=0.165.0",
  "nicegui>=4.1.0",
  "psycopg[binary]>=3.3.9",
  "docker>=7.2.0",
  "argon2-cffi>=25.1.0",
  "itsdangerous>=2.2.0",
  "httpx2>=2.16.2",
  "pydantic>=2.14.4",
  "pydantic-settings>=2.16.3",
  "nvidia-ml-py>=13.615.71",
  "pyyaml>=6.0.4",
  "uvicorn[standard]>=0.54.0",
  "cryptography>=50.0.2",
]
classifiers = [
    "Development Status :: 3 - Alpha",
]

[project.scripts]
orbitalwindow = "orbitalwindow.main:run"
orbitalwindow-reset-admin = "orbitalwindow.recover:main"

[tool.hatch.version]
path = "src/orbitalwindow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitalwindow"]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["pytest-asyncio>=1.5.0"]

[tool.hatch.envs.lint]
detached = true
dependencies = ["ruff>=0.17.6"]

[tool.hatch.envs.lint.scripts]
check = ["ruff check {args:.}", "ruff format --check {args:.}"]
fmt = ["ruff check --fix {args:.}", "ruff format {args:.}"]

[tool.hatch.envs.docs]
detached = true
dependencies = ["zensical>=0.1.3", "mkdocstrings-python>=2.0.11"]

[tool.hatch.envs.docs.scripts]
build = "zensical build -f docs/zensical.toml {args}"
serve = "zensical serve -f docs/zensical.toml {args}"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.typos.default]
extend-ignore-re = ["(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on"]

[tool.portfolio]
title = "Orbitalwindow"
summary = """
OrbitalWindow makes it possible for users to easily run multiple desktop environments on a server
the users needs no special software to access thier desktops.
All access is via a web browser.
OrbitalWindow helps with software install and launch of long running commands typical of research environments.
For servers with a GPU, the GPU is shared amoung the users with the permission to access it.
Thus creating an environment where researchers can fully untilise a GPU.
OrbitalWindow also make it easy run LLM's for AI chat, coding, or research.
The user interface allow the discovery, launch, and benchmark of models.
"""
differentiators = []
roadmap = []
