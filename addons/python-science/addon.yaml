key: python-science
label: Python science (conda)
description: >-
  Shared Miniforge install with a "science" environment (NumPy, SciPy, pandas, Matplotlib,
  scikit-learn, JupyterLab, Spyder). Create your own environments with conda; they are kept in
  your home folder.
restricted: false
script: install.sh
launchers: [ow-jupyterlab.desktop, ow-spyder.desktop]
mounts:
  - {source: shared/conda, target: /opt/conda, read_only: true}
env:
  # Spyder's help pane uses Qt WebEngine (Chromium); its sandbox can't start in a container (ADR 0022).
  QTWEBENGINE_DISABLE_SANDBOX: "1"
