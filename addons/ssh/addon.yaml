key: ssh
label: SSH and SFTP access
description: >-
  Connect to your running desktop with ssh, sftp, WinSCP or VS Code Remote-SSH, using a key you
  add on this page. Only works while your desktop is running.
restricted: false
apt: [openssh-server, openssh-sftp-server]
apk: [openssh-server, openssh-sftp-server]
dnf: [openssh-server]
pacman: [openssh]
script: install.sh
