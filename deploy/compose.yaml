# OrbitalWindow stack — production. Uses the published images
#   gitea.tu.tsolo.net/kuat/orbitalwindow:${OW_VERSION}        (the service)
#   gitea.tu.tsolo.net/kuat/orbitalwindow-samba:${OW_VERSION}  (Windows file sharing)
# built by CI (.gitea/workflows/build.yaml). OW_VERSION is a release tag (e.g. v1.0.0) or `main`.
#
# On a server, copy the deploy/ folder (this file, traefik/, the optional compose.nvidia.yaml and
# compose.tls.yaml, .env.example), create .env and run:
#   docker compose -f compose.yaml --env-file .env up -d          (or `make start PROD=1`)
# For development, `make start` adds compose.dev.yaml, which builds both images from the checkout.
#
# Desktop containers (ow-<user>) are not listed here: OrbitalWindow creates them through the
# Docker API.

name: orbitalwindow

x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  traefik:
    image: traefik:v3.7.14
    container_name: ow-traefik
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy-ro:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=ow-core
      # Keep routers of not-yet-healthy containers: users get 503 instead of 404 while the
      # service restarts or a desktop is still starting.
      - --providers.docker.allowEmptyServices=true
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      # Desktop streams are long-lived WebSockets; don't time them out.
      - --entrypoints.websecure.transport.respondingtimeouts.readtimeout=0
      - --log.level=INFO
      # Access log (JSON, to `docker logs ow-traefik`) for troubleshooting; see deploy/.env.
      - --accesslog=${OW_TRAEFIK_ACCESS_LOG:-false}
      - --accesslog.format=json
      - --accesslog.fields.headers.defaultmode=drop
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/dynamic.yaml:/etc/traefik/dynamic.yaml:ro
      - traefik-certs:/certs:ro
    networks: [core, proxy-ro]
    depends_on:
      socket-proxy-ro:
        condition: service_started
      certs:
        condition: service_completed_successfully
    security_opt: ["no-new-privileges:true"]

  # Creates Traefik's self-signed default certificate once (see traefik/dynamic.yaml).
  certs:
    image: alpine:3.22
    container_name: ow-certs
    restart: "no"
    command: ["/make-cert.sh"]
    environment:
      OW_HOSTNAME: ${OW_HOSTNAME:?set OW_HOSTNAME in deploy/.env}
    volumes:
      - ./traefik/make-cert.sh:/make-cert.sh:ro
      - traefik-certs:/certs
    networks: [gateway]

  # Read-only Docker API for Traefik: list/inspect containers and events only.
  socket-proxy-ro:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: ow-socket-proxy-ro
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      INFO: 1  # Dozzle reads /info
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy-ro]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: ["no-new-privileges:true"]

  # Read-write Docker API for OrbitalWindow: containers, exec, images, build, networks.
  socket-proxy-rw:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: ow-socket-proxy-rw
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      BUILD: 1
      NETWORKS: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      EVENTS: 1
      PING: 1
      VERSION: 1
      INFO: 0
      VOLUMES: 0
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [proxy-rw]
    read_only: true
    tmpfs: [/run, /tmp]
    security_opt: ["no-new-privileges:true"]

  orbitalwindow:
    image: ${OW_IMAGE:-gitea.tu.tsolo.net/kuat/orbitalwindow}:${OW_VERSION:-main}
    container_name: orbitalwindow
    restart: unless-stopped
    logging: *logging
    environment:
      OW_ROOT: ${OW_ROOT:-/srv/orbitalwindow}
      OW_HOSTNAME: ${OW_HOSTNAME:?set OW_HOSTNAME in deploy/.env}
      OW_GPU_VENDOR: ${OW_GPU_VENDOR:-nvidia}
      OW_DEFAULT_DESKTOP: ${OW_DEFAULT_DESKTOP:-ubuntu-xfce}
      TZ: ${TZ:-Etc/UTC}
      CONTROL_ADMIN_PASSWORD: ${CONTROL_ADMIN_PASSWORD:-}
      DOCKER_HOST: tcp://socket-proxy-rw:2375
    volumes:
      # Same path inside and outside, so mount sources we give Docker are valid host paths.
      - ${OW_ROOT:-/srv/orbitalwindow}:${OW_ROOT:-/srv/orbitalwindow}
      # The desktop image context, add-ons and help pages are baked into the image. To use your
      # own add-ons, mount a folder over /opt/orbitalwindow/addons (read-only).
    networks: [core, proxy-rw]
    # The server status page reads Prometheus node-exporter on the host (port 9100).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [socket-proxy-rw, samba]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ow-core
      traefik.http.routers.ow-ui.rule: PathPrefix(`/`)
      traefik.http.routers.ow-ui.priority: "1"
      traefik.http.routers.ow-ui.entrypoints: websecure
      traefik.http.routers.ow-ui.tls: "true"
      traefik.http.services.ow-ui.loadbalancer.server.port: "8000"
      # Used by every desktop router (labels set by OrbitalWindow on ow-<user>).
      traefik.http.middlewares.ow-auth-desktop.forwardauth.address: http://orbitalwindow:8000/auth/desktop
      traefik.http.middlewares.ow-auth-desktop.forwardauth.authResponseHeaders: X-OW-User
      traefik.http.middlewares.ow-desktop-slash.redirectregex.regex: ^(https?://[^/]+/desktop/[a-z0-9]+/[0-9a-f]+)$$
      traefik.http.middlewares.ow-desktop-slash.redirectregex.replacement: $${1}/
      traefik.http.middlewares.ow-desktop-slash.redirectregex.permanent: "true"
      # Used by every file manager router (labels set by OrbitalWindow on ow-files-<user>).
      traefik.http.middlewares.ow-auth-files.forwardauth.address: http://orbitalwindow:8000/auth/files
      traefik.http.middlewares.ow-auth-files.forwardauth.authResponseHeaders: X-OW-User
      traefik.http.middlewares.ow-files-slash.redirectregex.regex: ^(https?://[^/]+/files/[a-z0-9]+)$$
      traefik.http.middlewares.ow-files-slash.redirectregex.replacement: $${1}/
      traefik.http.middlewares.ow-files-slash.redirectregex.permanent: "true"
      # Admin-only tools (cAdvisor, later Dozzle).
      traefik.http.middlewares.ow-auth-admin.forwardauth.address: http://orbitalwindow:8000/auth/admin
      traefik.http.middlewares.ow-auth-admin.forwardauth.authResponseHeaders: Remote-User

  # Container metrics from cgroups only: no Docker or containerd socket, not privileged.
  # OrbitalWindow maps container IDs to names itself (see ADR 0017).
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: ow-cadvisor
    restart: unless-stopped
    logging: *logging
    command:
      - --docker_only=false
      - --raw_cgroup_prefix_whitelist=/system.slice/docker-,/docker/
      - --housekeeping_interval=10s
      - --url_base_prefix=/admin/cadvisor
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    # Not privileged: without /dev/kmsg cAdvisor only loses OOM events, which we don't use.
    networks: [core]
    # The image's own check calls /healthz, which moves under --url_base_prefix.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/admin/cadvisor/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ow-core
      traefik.http.routers.ow-cadvisor.rule: PathPrefix(`/admin/cadvisor`)
      traefik.http.routers.ow-cadvisor.entrypoints: websecure
      traefik.http.routers.ow-cadvisor.tls: "true"
      traefik.http.routers.ow-cadvisor.middlewares: ow-auth-admin@docker
      traefik.http.services.ow-cadvisor.loadbalancer.server.port: "8080"

  # SSH/SFTP gateway: routes `ssh -p 2222 <user>@host` to that user's desktop by container labels.
  sshpiper:
    image: farmer1992/sshpiperd:full-v1.6.1
    container_name: ow-sshpiper
    restart: unless-stopped
    logging: *logging
    # failtoban blocks addresses after repeated failed logins; docker routes by labels.
    command: ["/sshpiperd/plugins/failtoban", "--", "/sshpiperd/plugins/docker"]
    environment:
      DOCKER_HOST: tcp://socket-proxy-ro:2375
      SSHPIPERD_SERVER_KEY: /keys/ssh_host_ed25519_key
      SSHPIPERD_SERVER_KEY_GENERATE_MODE: notexist
    ports:
      - "2222:2222"
    volumes:
      - sshpiper-keys:/keys
    # OrbitalWindow connects it to ow-net-<user> of desktops with the ssh add-on. "gateway" is an
    # ordinary bridge: a container on internal networks only cannot publish its port.
    networks: [proxy-ro, gateway]
    depends_on: [socket-proxy-ro]
    # Root in the container only to write its host key volume; no capabilities.
    user: "0:0"
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]

  # Container logs for admins at /admin/logs/. Dozzle trusts Remote-User blindly, so it is only
  # on ow-core (Traefik, OrbitalWindow, cAdvisor), never on a network desktops can reach.
  dozzle:
    image: amir20/dozzle:v11.3.0
    container_name: ow-dozzle
    restart: unless-stopped
    logging: *logging
    environment:
      DOCKER_HOST: tcp://socket-proxy-ro:2375
      DOZZLE_BASE: /admin/logs
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_NO_ANALYTICS: "true"
    networks: [core, proxy-ro]
    depends_on: [socket-proxy-ro]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ow-core
      traefik.http.routers.ow-dozzle.rule: PathPrefix(`/admin/logs`)
      traefik.http.routers.ow-dozzle.entrypoints: websecure
      traefik.http.routers.ow-dozzle.tls: "true"
      traefik.http.routers.ow-dozzle.middlewares: ow-auth-admin@docker
      traefik.http.services.ow-dozzle.loadbalancer.server.port: "8080"

  samba:
    image: ${OW_SAMBA_IMAGE:-gitea.tu.tsolo.net/kuat/orbitalwindow-samba}:${OW_VERSION:-main}
    container_name: ow-samba
    restart: unless-stopped
    logging: *logging
    ports:
      - "445:445"
    volumes:
      - ${OW_ROOT:-/srv/orbitalwindow}/users:/srv/users
      - ${OW_ROOT:-/srv/orbitalwindow}/groups:/srv/groups
      - ${OW_ROOT:-/srv/orbitalwindow}/shared/scratch:/srv/scratch
      - ${OW_ROOT:-/srv/orbitalwindow}/state/samba:/etc/ow:ro
      - samba-lib:/var/lib/samba
    networks: [samba]

networks:
  core:
    name: ow-core
  proxy-ro:
    name: ow-proxy-ro
    internal: true
  proxy-rw:
    name: ow-proxy-rw
    internal: true
  samba:
    name: ow-samba
  gateway:
    name: ow-gateway

volumes:
  samba-lib:
    name: ow-samba-lib
  sshpiper-keys:
    name: ow-sshpiper-keys
  traefik-certs:
    name: ow-traefik-certs
