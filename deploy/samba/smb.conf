[global]
   workgroup = WORKGROUP
   server string = OrbitalWindow
   server role = standalone server
   security = user
   passdb backend = tdbsam
   server min protocol = SMB2_10
   # Windows 11 24H2 requires signing.
   server signing = mandatory
   server smb encrypt = desired
   map to guest = never
   restrict anonymous = 2
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # Users only see the shares they may open.
   access based share enum = yes
   # Hide dot files (.config, .conda, …) so they can't be broken from Windows.
   veto files = /.*/
   delete veto files = no
   log file = /dev/stdout
   log level = 1
   unix password sync = no
   include = /etc/samba/ow-shares.conf
